<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Orbit Trace · real trajectory review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#03080e;color:#d9e4ed;font:13px system-ui}header{height:94px;padding:18px 28px;border-bottom:1px solid #23313e;display:flex;align-items:center;gap:20px}h1{font-size:20px;letter-spacing:.15em;margin:0}small{color:#8a9eaf;display:block;margin-top:6px}button,select{background:#0e1c28;color:#dce7ef;border:1px solid #3a4b59;border-radius:3px;padding:8px;cursor:pointer}canvas{display:block;width:100%;height:calc(100vh - 154px)}footer{height:60px;padding:10px 28px;display:flex;align-items:center;gap:12px;font-size:11px}#status{margin-left:auto;color:#9bb5c8}#report{display:none}</style></head><body>
<header><div><h1>ORBITWATCH / ORBIT TRACE</h1><small>Real recorded SGP4 · Earth occlusion · NASA/JPL/USGS reference texture</small></div><label>Scene <select id="case"><option value="polar">Polar · Landsat 8 (PACE-like)</option><option value="eccentric">Highly eccentric · Chandra</option><option value="geo">Geostationary · INSAT-3DS</option><option value="gps">Navigation · GPS</option><option value="dense">Dense · 44 satellites</option></select></label><label><input id="selected" type="checkbox"> Selected</label><button id="reset">Frame orbit</button></header>
<canvas id="scene" aria-label="Real orbital scene"></canvas>
<footer><button id="near">Zoom in</button><button id="far">Zoom out</button><button id="drag">Orbit camera</button><button id="step">Advance 30 seconds</button><button id="refresh">Refresh trajectory</button><button id="play">Play real time</button><button id="dispose">Dispose scene</button><output id="status" role="status">Preparing real trajectories…</output></footer><pre id="report" aria-label="Trace diagnostics"></pre><script type="module" src="/tests/orbit-trace.js"></script></body></html>
