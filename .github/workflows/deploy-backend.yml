name: Deploy OrbitWatch backend to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbitwatch-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: i-023956a348484552e
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Read pushed commit and compare requirements
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect requirements changes in this push
        id: reqs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=false
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            changed=true
          elif ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- backend/requirements.txt backend/requirements.lock; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Requirements changed in GitHub push: $changed"

      - name: Authenticate with restricted AWS IAM access key
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Tell EC2 to deploy this commit
        id: send
        shell: bash
        env:
          REQUIREMENTS_CHANGED_IN_PUSH: ${{ steps.reqs.outputs.changed }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          sha = os.environ['DEPLOY_SHA']
          reqs = os.environ['REQUIREMENTS_CHANGED_IN_PUSH']
          assert reqs in ('true', 'false')
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('Invalid commit SHA')
          with open('ssm-parameters.json', 'w') as f:
              json.dump({
                  'commands': [f'/usr/local/sbin/orbitwatch-deploy {sha} {reqs}'],
                  'executionTimeout': ['1200'],
              }, f)
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 1200 \
            --comment "OrbitWatch backend deploy from GitHub main" \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched AWS SSM command: $command_id"

      - name: Wait for deployment and show result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json > invocation.json 2> invocation.err; then
              if grep -q InvocationDoesNotExist invocation.err; then
                sleep 5
                continue
              fi
              cat invocation.err >&2
              exit 1
            fi
            status="$(python3 -c 'import json; print(json.load(open("invocation.json"))["Status"])')"
            echo "SSM deployment status: $status"
            case "$status" in
              Success)
                python3 - <<'PY'
          import json
          data=json.load(open('invocation.json'))
          print(data.get('StandardOutputContent', ''))
          print(data.get('StandardErrorContent', ''))
          PY
                exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                python3 - <<'PY'
          import json
          data=json.load(open('invocation.json'))
          print(data.get('StandardOutputContent', ''))
          print(data.get('StandardErrorContent', ''))
          PY
                exit 1 ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "Unexpected SSM status: $status" >&2; exit 1 ;;
            esac
          done
          echo "SSM deployment did not finish within the polling window" >&2
          exit 1
